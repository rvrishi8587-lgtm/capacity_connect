<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Capacity Connect — Assessment</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="assessment">
  <div class="dashboard">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <div class="logo-icon">📚</div>
          <span>Capacity Connect</span>
        </div>
      </div>
      <nav class="sidebar-nav">
        <a href="trainee-dashboard.html"><span class="nav-icon">🏠</span> Dashboard</a>
        <a href="courses.html"><span class="nav-icon">📖</span> Courses</a>
        <a href="trainee-dashboard.html#myLearning"><span class="nav-icon">🎓</span> My Learning</a>
        <a href="trainee-dashboard.html#assessments"><span class="nav-icon">📝</span> Assessments</a>
        <a href="trainee-dashboard.html#results"><span class="nav-icon">📊</span> Results</a>
        <a href="#" onclick="logout()"><span class="nav-icon">🚪</span> Logout</a>
      </nav>
    </aside>

    <!-- Main content -->
    <main class="main-content">
      <div class="topbar">
        <button class="mobile-toggle" onclick="toggleSidebar()">☰</button>
        <h1 id="assessmentTitle">Assessment</h1>
        <div class="user-info">
          <div class="user-avatar">T</div>
          <span id="userName">Trainee</span>
        </div>
      </div>

      <div id="assessmentContent">
        <div class="section">
          <div class="section-header">
            <h2>MCQ Assessment</h2>
          </div>
          <form id="assessmentForm"></form>
        </div>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
  <script>
    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
    }
  </script>
</body>
</html>
