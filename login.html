<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Capacity Connect — Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="login" class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="logo-icon">📚</div>
      <h1>CAPACITY CONNECT</h1>
      <p>Digital Capacity Building & Learning Management</p>
    </div>

    <form class="auth-form" id="loginForm">
      <div id="loginError" class="auth-error"></div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <div class="input-group">
          <input type="email" id="email" placeholder="you@example.com" required autofocus>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-group">
          <input type="password" id="password" placeholder="Enter your password" required>
          <button type="button" class="toggle-btn" id="togglePassword">👁</button>
        </div>
      </div>

      <div class="form-row">
        <label class="checkbox-label">
          <input type="checkbox" id="remember" checked>
          <span>Remember me</span>
        </label>
        <a href="register.html">Don't have an account? Register</a>
      </div>

      <button type="submit" class="btn btn-primary btn-block">Login</button>
    </form>

    <div class="demo-accounts">
      <h4>Demo Accounts (password: 123456)</h4>
      <p>Trainee: trainee@test.com</p>
      <p>Trainer: trainer@test.com</p>
      <p>Admin: admin@test.com</p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
