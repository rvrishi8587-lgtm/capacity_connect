<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Capacity Connect — Trainee Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="trainee-dashboard">
  <div class="dashboard">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <div class="logo-icon">📚</div>
          <span>Capacity Connect</span>
        </div>
      </div>
      <nav class="sidebar-nav">
        <a href="trainee-dashboard.html" class="active"><span class="nav-icon">🏠</span> Dashboard</a>
        <a href="courses.html"><span class="nav-icon">📖</span> Courses</a>
        <a href="trainee-dashboard.html#myLearning"><span class="nav-icon">🎓</span> My Learning</a>
        <a href="trainee-dashboard.html#assessments"><span class="nav-icon">📝</span> Assessments</a>
        <a href="trainee-dashboard.html#results"><span class="nav-icon">📊</span> Results</a>
        <a href="#" onclick="logout()"><span class="nav-icon">🚪</span> Logout</a>
      </nav>
    </aside>

    <!-- Main content -->
    <main class="main-content">
      <div class="topbar">
        <button class="mobile-toggle" onclick="toggleSidebar()">☰</button>
        <h1>Trainee Dashboard</h1>
        <div class="user-info">
          <div class="user-avatar" id="userAvatar">T</div>
          <span id="userName">Trainee</span>
        </div>
      </div>

      <!-- Stats -->
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-icon blue">📖</div>
          <div class="stat-value" id="statMyCourses">0</div>
          <div class="stat-label">My Courses</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon green">✅</div>
          <div class="stat-value" id="statCompleted">0</div>
          <div class="stat-label">Completed Courses</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon amber">⏳</div>
          <div class="stat-value" id="statPending">0</div>
          <div class="stat-label">Pending Assessments</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon cyan">📊</div>
          <div class="stat-value" id="statAvgScore">0%</div>
          <div class="stat-label">Average Score</div>
        </div>
      </div>

      <!-- Available Courses -->
      <div class="section" id="availableCoursesSection">
        <div class="section-header">
          <h2>Available Courses</h2>
          <a href="courses.html" class="btn btn-sm btn-secondary">View All</a>
        </div>
        <div class="courses-grid" id="availableCourses"></div>
      </div>

      <!-- My Enrolled Courses -->
      <div class="section" id="myLearning">
        <div class="section-header">
          <h2>My Enrolled Courses & Learning Progress</h2>
        </div>
        <div class="courses-grid" id="myCourses"></div>
      </div>

      <!-- Results -->
      <div class="section" id="results">
        <div class="section-header">
          <h2>Assessment Results</h2>
        </div>
        <div id="resultsContainer"></div>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
  <script>
    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
    }
    // Render results section
    document.addEventListener('DOMContentLoaded', () => {
      const user = getCurrentUser();
      if (!user) return;
      const container = document.getElementById('resultsContainer');
      const results = getResultsByUser(user.id);
      if (results.length === 0) {
        container.innerHTML = '<p class="empty-state">No assessment results yet. Take an assessment from a course page.</p>';
        return;
      }
      container.innerHTML = `
        <div class="table-container">
          <table>
            <thead>
              <tr><th>Course</th><th>Score</th><th>Percentage</th><th>Status</th><th>Date</th></tr>
            </thead>
            <tbody>
              ${results.map(r => {
                const course = getCourseById(r.courseId);
                return `<tr>
                  <td>${escapeHtml(course ? course.title : 'Unknown')}</td>
                  <td>${r.score}/${r.total}</td>
                  <td>${r.percentage}%</td>
                  <td><span class="badge ${r.percentage >= 60 ? 'badge-success' : 'badge-error'}">${r.percentage >= 60 ? 'Pass' : 'Fail'}</span></td>
                  <td>${new Date(r.takenAt).toLocaleDateString()}</td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>`;
    });
  </script>
</body>
</html>
